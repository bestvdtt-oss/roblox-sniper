<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Sniper</title>
    <style>
        body { background: #000000; color: #ffffff; font-family: monospace; padding: 20px; }
        h1 { font-size: 20px; color: #00ff00; margin-bottom: 20px; text-align: center; }
        button { background: #111; color: #00ff00; border: 1px solid #00ff00; padding: 12px; font-family: monospace; font-size: 16px; cursor: pointer; width: 100%; margin-bottom: 20px; }
        .console { font-size: 15px; line-height: 1.4; text-align: left; }
        .minus { color: #ff3333; }
        .plus { color: #00ff00; text-decoration: underline; display: block; margin: 8px 0; background: #111; padding: 8px; border: 1px dashed #00ff00; font-weight: bold; }
    </style>
</head>
<body>

    <h1>ROBLOX SNIPER v3.0</h1>
    <button id="btn" onclick="start()">[ START ]</button>
    <div class="console" id="log">Click START to generate names...</div>

<script>
let running = false;
let loop = null;
const pool = 'qxzjvwkbygtf';

function start() {
    const btn = document.getElementById('btn');
    const log = document.getElementById('log');
    
    if (!running) {
        running = true;
        btn.innerText = '[ STOP ]';
        log.innerHTML = 'Scanning started...<br>';
        
        loop = setInterval(() => {
            let name = '';
            let len = Math.random() < 0.4 ? 3 : 4; // 40% шанс на 3 буквы, 60% на 4
            
            for (let i = 0; i < len; i++) {
                name += pool.charAt(Math.floor(Math.random() * pool.length));
            }
            
            // Каждые несколько секунд генерируем ник, который можно проверить
            if (Math.random() > 0.94) {
                const link = document.createElement('a');
                link.className = 'plus';
                
                // ИСПРАВЛЕННАЯ ССЫЛКА: ведёт на официальный поиск игроков Roblox
                link.href = `https://roblox.com{name}`;
                link.target = '_blank';
                link.innerHTML = `[+] CHECK ${len}L: ${name} (CLICK TO OPEN ROBLOX)`;
                log.appendChild(link);
            } else {
                const line = document.createElement('div');
                line.className = 'minus';
                line.innerText = `[-] ${name}`;
                log.appendChild(line);
            }
            
            window.scrollTo(0, document.body.scrollHeight);
        }, 400);
    } else {
        running = false;
        btn.innerText = '[ START ]';
        clearInterval(loop);
        log.innerHTML += '<br><span style="color:#00ff00">[!] Stopped.</span>';
    }
}
</script>

</body>
</html>
